[package]
name = "line-integral-convolution-gpu"
version = "0.1.0"
edition = "2021"

[dependencies]
bevy = { version = "0.15", features = ["dynamic_linking"] }
wgpu = { version = "24", features = ["wgsl"] }
bytemuck = "1.14"
noise = "0.8"
rand = "0.8"
rand_chacha = "0.3"

[profile.dev]
opt-level = 1
debug = true

[profile.release]
opt-level = 3
lto = true
codegen-units = 1